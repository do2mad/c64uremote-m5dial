; ------------------------------------------------------------------
; C64uRemote fuer M5Dial (StampS3 / ESP32-S3)
;   + eingebauter RFID/NFC-Leser (WS1850S, interner I2C, 0x28)
;   + nachgeruestetes microSD-Modul (SPI ueber Port A + Port B)
;
;   Build:    pio run
;   Flashen:  pio run -t upload
;   Monitor:  pio device monitor
;
; Hinweis zum Flashen: der StampS3 im M5Dial meldet sich als native
; USB-CDC. Kommt kein Port zustande, den Knopf beim Einstecken gedrueckt
; halten (Download-Modus) und danach einmal Reset ausloesen.
; ------------------------------------------------------------------

[platformio]
default_envs = m5dial

[env:m5dial]
platform  = espressif32@^6.9.0
board     = m5stack-stamps3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; Grosses App-Image, kein OTA -> genug Platz fuer WiFi + SD + RFID
board_build.partitions = huge_app.csv

; Der StampS3 hat kein PSRAM. Der Offscreen-Puffer (240x240x2 = 115 kB)
; liegt daher im internen SRAM; der Code faellt automatisch auf direktes
; Zeichnen zurueck, falls der Speicher einmal nicht reicht.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Dial @ ^1.0.2
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.11
    bblanchon/ArduinoJson @ ^6.21.5
